name: plantheath
description: "Durian Leaf Health & Pathology AI - Dual-Modal Disease & Micronutrient Real-Time Vision Analyzer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  camera: ^0.12.0+2
  image: ^4.1.7
  path_provider: ^2.1.3
  intl: ^0.19.0
  share_plus: ^9.0.0
  csv: ^6.0.0
  geolocator: ^12.0.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/color_standards/
    - assets/labels.json
    - assets/docs/
    - assets/images/
