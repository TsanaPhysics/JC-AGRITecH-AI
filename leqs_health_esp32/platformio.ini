; ============================================================================
; LEQs AgriSci xAI — Health Step Tracker ESP32 Module
; บอร์ด: ESP32-S3 / ESP32 DevKit (ใช้ได้ทั้ง 2 รุ่น)
; ใช้ร่วมกับ Flutter App: smart_health_tracker
; ============================================================================

[env:esp32-s3-atd35]
; สำหรับบอร์ด ATD3.5-S3 (ESP32-S3)
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
board_build.mcu      = esp32s3
board_build.f_cpu    = 240000000L
build_flags          = -DARDUINO_USB_CDC_ON_BOOT=0 -DCORE_DEBUG_LEVEL=2
upload_speed         = 460800
monitor_speed        = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

[env:esp32-devkit]
; สำหรับ ESP32 DevKit v1 ทั่วไป
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
