[env:esp32-s3-atd35]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ตั้งค่า ESP32-S3 ตามสเปกบอร์ด ATD3.5-S3 (8MB Flash, 8MB OPI PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2

monitor_speed = 115200
upload_speed = 460800
; ปล่อยให้ PlatformIO ค้นหา Serial Port อัตโนมัติ (หรือระบุเฉพาะตอนที่ทราบพอร์ตแน่นอน เช่น /dev/cu.usbserial-10)
; upload_port = /dev/cu.usbserial-10
; monitor_port = /dev/cu.usbserial-10

lib_deps = 
    lovyan03/LovyanGFX@^1.1.16
    Wire
    SPI
    4-20ma/ModbusMaster@^2.0.1
    claws/BH1750@^1.3.0
    sensirion/Sensirion I2C SHT4x@^1.1.0
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
