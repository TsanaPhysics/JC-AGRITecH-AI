<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
  <defs>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Symbol: Sprout in Gear -->
  <g transform="translate(10, 10)">
     <path d="M30 15 L30 45" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
     <path d="M30 30 Q10 10 30 15 Z" fill="url(#gradGreen)" />
     <path d="M30 30 Q50 10 30 15 Z" fill="url(#gradGreen)" />
     <circle cx="30" cy="45" r="3" fill="#22c55e" />
     
     <!-- Tech Orbit/Gear hints -->
     <path d="M10 45 A 20 10 0 0 0 50 45" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2" opacity="0.8" />
     <circle cx="10" cy="45" r="2" fill="#3b82f6" />
     <circle cx="50" cy="45" r="2" fill="#3b82f6" />
  </g>

  <!-- Text -->
  <text x="65" y="35" font-family="'Nunito', 'Sarabun', sans-serif" font-weight="800" font-size="24" fill="#3b82f6" filter="url(#dropShadow)">Young Digital</text>
  <text x="65" y="65" font-family="'Nunito', 'Sarabun', sans-serif" font-weight="900" font-size="32" fill="url(#gradOrange)" filter="url(#dropShadow)" letter-spacing="0.5">Agri-Innovator</text>
</svg>
